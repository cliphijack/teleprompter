<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>프롬프터</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: 'Noto Sans KR', -apple-system, sans-serif; background: #111; color: #eee; height: 100dvh; overflow: hidden; position: relative; }

  /* ── 메인 영역 (풀스크린) ── */
  #main-area { position: absolute; inset: 0; display: flex; flex-direction: column; }

  /* ── 에디터 ── */
  #editor-view { flex: 1; display: flex; flex-direction: column; padding: 14px 50px 14px 14px; gap: 10px; min-height: 0; }
  #editor {
    flex: 1; background: #1e1e1e; color: #eee; border: 1px solid #333;
    border-radius: 10px; padding: 14px; font-size: 15px; line-height: 1.7;
    resize: none; outline: none; min-height: 0;
  }

  /* ── 프롬프터 ── */
  #prompter-view { flex: 1; display: none; min-height: 0; overflow: hidden; position: relative; }
  #prompter-scroll {
    position: absolute; inset: 0; inset-inline-end: 30px;
    overflow-y: scroll; overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    padding: 30px 50px 30px 40px;
  }
  #prompter-scroll::-webkit-scrollbar { display: none; }
  @media (max-width: 600px) { #prompter-scroll { padding: 20px 46px 20px 18px; } }
  #prompter-text {
    font-size: 36px; line-height: 1.9; color: #ddd; white-space: pre-wrap;
    padding-bottom: 60dvh; word-break: keep-all; max-width: 20em; margin: 0 auto;
  }

  /* 탭 힌트 */
  #tap-hint {
    position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.65); color: #ccc; font-size: 13px;
    padding: 8px 20px; border-radius: 20px; pointer-events: none;
    opacity: 0; transition: opacity 0.4s; white-space: nowrap; z-index: 5; display: none;
  }
  #tap-hint.show { opacity: 1; }

  /* ── 플로팅 사이드바 ── */
  #sidebar-wrap {
    position: fixed; right: 0; top: 0; height: 100%;
    display: flex; flex-direction: row; align-items: stretch;
    z-index: 200;
  }

  /* 슬라이딩 패널 */
  #sb-panel {
    width: 164px; overflow: hidden;
    transition: width 0.25s cubic-bezier(0.4,0,0.2,1),
                opacity 0.2s ease;
    background: rgba(16,16,16,0.97);
    border-left: 1px solid #2a2a2a;
    backdrop-filter: blur(6px);
  }
  #sb-panel.collapsed { width: 0; opacity: 0; pointer-events: none; }

  /* 내부 스크롤 컨테이너 (min-width 고정으로 overflow:hidden 애니 보조) */
  #sb-inner {
    min-width: 164px; height: 100%;
    overflow-y: auto; overflow-x: hidden;
    padding: 14px 10px 20px;
    display: flex; flex-direction: column; gap: 10px;
  }
  #sb-inner::-webkit-scrollbar { width: 2px; }
  #sb-inner::-webkit-scrollbar-thumb { background: #333; }

  /* 탭 (항상 노출) */
  #sb-tab {
    width: 24px; flex-shrink: 0;
    background: rgba(20,20,20,0.92);
    border: none; border-left: 1px solid #2a2a2a;
    color: #666; cursor: pointer; font-size: 11px;
    display: flex; align-items: center; justify-content: center;
    touch-action: manipulation;
    transition: color 0.2s;
  }
  #sb-tab:hover { color: #aaa; background: rgba(30,30,30,0.95); }

  /* ── 사이드바 내 섹션 ── */
  .sb-sec { display: flex; flex-direction: column; gap: 5px; padding-bottom: 10px; border-bottom: 1px solid #222; }
  .sb-sec:last-child { border-bottom: none; }
  .sb-lbl { font-size: 9px; color: #444; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 1px; }

  /* 버튼 공통 */
  .sb-btn {
    padding: 8px 6px; border: none; border-radius: 7px; cursor: pointer;
    font-size: 11px; font-weight: 700; touch-action: manipulation; text-align: center;
    transition: opacity 0.15s;
  }
  .sb-btn:active { opacity: 0.7; }
  .sb-row { display: flex; gap: 5px; }
  .sb-row .sb-btn { flex: 1; }

  #btn-load  { background: #1a3a52; color: #5bb3e8; }
  #btn-save  { background: #2a2a2a; color: #999; }
  #btn-edit  { background: #2a2a2a; color: #ccc; width: 100%; }
  #btn-start { background: #1a4a2a; color: #2ecc71; width: 100%; }
  #btn-stop  { background: #4a1a1a; color: #e74c3c; width: 100%; display: none; }

  /* 모드 버튼 */
  .mode-btn {
    width: 100%; padding: 8px 8px; border: 1px solid #2a2a2a; border-radius: 7px;
    background: #1a1a1a; color: #555; cursor: pointer; font-size: 11px; font-weight: 700;
    text-align: left; touch-action: manipulation; transition: all 0.15s;
  }
  .mode-btn.active { background: rgba(243,156,18,0.15); color: #f39c12; border-color: rgba(243,156,18,0.4); }

  /* 슬라이더 */
  .sl-row { display: flex; flex-direction: column; gap: 4px; }
  .sl-hd { display: flex; justify-content: space-between; font-size: 10px; color: #555; }
  .sl-hd span:last-child { color: #888; }
  .sl-row input[type=range] { width: 100%; accent-color: #2ecc71; height: 16px; cursor: pointer; }

  /* 정렬 */
  #btn-align-left, #btn-align-center {
    flex: 1; background: #1a1a1a; color: #555; border: 1px solid #2a2a2a; border-radius: 7px;
    padding: 7px; font-size: 12px; cursor: pointer; touch-action: manipulation;
  }
  #btn-align-left.active, #btn-align-center.active { background: #2a2a2a; color: #ddd; border-color: #444; }

  /* 눈고정 */
  #btn-eye-fix { background: #1a1a1a; color: #555; border: 1px solid #2a2a2a; border-radius: 7px; width: 100%; padding: 8px; font-size: 11px; cursor: pointer; touch-action: manipulation; }
  #btn-eye-fix.active { background: rgba(142,68,173,0.2); color: #a855f7; border-color: rgba(142,68,173,0.4); }
  #eye-fix-ctrl { display: none; }

  /* 상태 */
  #status { display: flex; align-items: center; gap: 6px; font-size: 10px; color: #555; padding: 2px 0; }
  #indicator { width: 7px; height: 7px; border-radius: 50%; background: #333; flex-shrink: 0; }
  #indicator.active { background: #2ecc71; animation: pulse 0.8s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  #shortcut-hint { font-size: 9px; color: #444; line-height: 1.8; display: none; }
  #file-input { display: none; }
</style>
</head>
<body>

<div id="main-area">
  <div id="editor-view">
    <textarea id="editor" placeholder="여기에 대본을 붙여넣거나 파일을 로드하세요..."></textarea>
  </div>
  <div id="prompter-view">
    <div id="tap-hint"></div>
    <div id="prompter-scroll">
      <div id="prompter-text"></div>
    </div>
  </div>
</div>

<!-- 플로팅 사이드바 -->
<div id="sidebar-wrap">
  <div id="sb-panel">
    <div id="sb-inner">

      <!-- 파일 / 내비 -->
      <div class="sb-sec">
        <div class="sb-row">
          <button id="btn-load" class="sb-btn">📂 로드</button>
          <button id="btn-save" class="sb-btn">💾 저장</button>
        </div>
        <button id="btn-edit" class="sb-btn">✏️ 편집모드</button>
        <button id="btn-start" class="sb-btn">▶ 시작</button>
        <button id="btn-stop" class="sb-btn">■ 정지</button>
        <input type="file" id="file-input" accept=".txt,.md">
      </div>

      <!-- 모드 -->
      <div class="sb-sec">
        <div class="sb-lbl">모드</div>
        <button id="btn-mode-voice" class="mode-btn active">🎙 발화감지</button>
        <button id="btn-mode-tap" class="mode-btn">📱 터치</button>
        <button id="btn-mode-keyboard" class="mode-btn">🖥 키보드</button>
        <div id="shortcut-hint">Space: 시작/정지<br>↑↓: 속도<br>←→: 스크롤<br>R: 처음으로</div>
      </div>

      <!-- 슬라이더 -->
      <div class="sb-sec">
        <div class="sl-row">
          <div class="sl-hd"><span>글자크기</span><span id="font-val">36px</span></div>
          <input type="range" id="font-range" min="20" max="100" value="36">
        </div>
        <div class="sl-row">
          <div class="sl-hd"><span>줄너비</span><span id="width-val">20자</span></div>
          <input type="range" id="width-range" min="10" max="40" value="20">
        </div>
        <div class="sl-row">
          <div class="sl-hd"><span>스크롤속도</span><span id="speed-val">5</span></div>
          <input type="range" id="speed-range" min="1" max="20" value="5">
        </div>
      </div>

      <!-- 정렬 / 눈고정 -->
      <div class="sb-sec">
        <div class="sb-lbl">정렬</div>
        <div class="sb-row">
          <button id="btn-align-left" class="active">≡ 좌</button>
          <button id="btn-align-center">≡ 중</button>
        </div>
        <button id="btn-eye-fix">👁 눈고정 모드</button>
        <div id="eye-fix-ctrl">
          <div class="sl-row" style="margin-top:4px">
            <div class="sl-hd"><span>고정너비</span><span id="eye-width-val">600px</span></div>
            <input type="range" id="eye-width-range" min="200" max="1200" value="600" step="20" style="accent-color:#a855f7">
          </div>
        </div>
      </div>

      <!-- 상태 -->
      <div class="sb-sec">
        <div id="status"><span id="indicator"></span><span id="status-text">대기 중</span></div>
      </div>

    </div>
  </div>
  <button id="sb-tab" title="메뉴 열기/닫기">◀</button>
</div>

<script>
const editor         = document.getElementById('editor');
const prompterView   = document.getElementById('prompter-view');
const editorView     = document.getElementById('editor-view');
const prompterText   = document.getElementById('prompter-text');
const prompterScroll = document.getElementById('prompter-scroll');
const btnStart       = document.getElementById('btn-start');
const btnStop        = document.getElementById('btn-stop');
const btnEdit        = document.getElementById('btn-edit');
const btnLoad        = document.getElementById('btn-load');
const btnSave        = document.getElementById('btn-save');
const fileInput      = document.getElementById('file-input');
const fontRange      = document.getElementById('font-range');
const fontVal        = document.getElementById('font-val');
const widthRange     = document.getElementById('width-range');
const widthVal       = document.getElementById('width-val');
const speedRange     = document.getElementById('speed-range');
const speedVal       = document.getElementById('speed-val');
const btnAlignLeft   = document.getElementById('btn-align-left');
const btnAlignCenter = document.getElementById('btn-align-center');
const btnEyeFix      = document.getElementById('btn-eye-fix');
const eyeFixCtrl     = document.getElementById('eye-fix-ctrl');
const eyeWidthRange  = document.getElementById('eye-width-range');
const eyeWidthVal    = document.getElementById('eye-width-val');
const indicator      = document.getElementById('indicator');
const statusText     = document.getElementById('status-text');
const btnModeVoice   = document.getElementById('btn-mode-voice');
const btnModeTap     = document.getElementById('btn-mode-tap');
const btnModeKeyboard= document.getElementById('btn-mode-keyboard');
const shortcutHint   = document.getElementById('shortcut-hint');
const tapHint        = document.getElementById('tap-hint');
const sbPanel        = document.getElementById('sb-panel');
const sbTab          = document.getElementById('sb-tab');

let loadedFileName = 'script';
let eyeFixMode     = false;
let mode           = 'voice';
let scrollInterval = null;
let recognition    = null;
let isRecognizing  = false;
let speechTimeout  = null;
let tapHintTimer   = null;
let sidebarOpen    = true;

// ── 사이드바 토글 ─────────────────────────────────────────────
sbTab.addEventListener('click', () => {
  sidebarOpen = !sidebarOpen;
  sbPanel.classList.toggle('collapsed', !sidebarOpen);
  sbTab.textContent = sidebarOpen ? '◀' : '▶';
});

// ── 모드 전환 ────────────────────────────────────────────────
btnModeVoice.onclick    = () => setMode('voice');
btnModeTap.onclick      = () => setMode('tap');
btnModeKeyboard.onclick = () => setMode('keyboard');

function setMode(m) {
  mode = m;
  btnModeVoice.classList.toggle('active', m === 'voice');
  btnModeTap.classList.toggle('active', m === 'tap');
  btnModeKeyboard.classList.toggle('active', m === 'keyboard');
  shortcutHint.style.display = m === 'keyboard' ? 'block' : 'none';
  tapHint.style.display      = m === 'tap'      ? 'block' : 'none';
  if (prompterView.style.display !== 'none') {
    stopAll();
    if (m === 'voice')    startRecognition();
    else if (m === 'tap') showTapHint('탭으로 시작/정지');
    else                  startScroll();
  }
}

// ── 탭 감지 ──────────────────────────────────────────────────
let tapStartY = 0, tapStartTime = 0;
prompterScroll.addEventListener('touchstart', (e) => {
  tapStartY = e.touches[0].clientY;
  tapStartTime = Date.now();
}, { passive: true });
prompterScroll.addEventListener('touchend', (e) => {
  if (mode !== 'tap') return;
  const dy = Math.abs(e.changedTouches[0].clientY - tapStartY);
  const dt = Date.now() - tapStartTime;
  if (dy < 12 && dt < 300) {
    scrollInterval ? stopScroll() : startScroll();
    showTapHint(scrollInterval ? '스크롤 중 ▶' : '정지 ■');
  }
}, { passive: true });

function showTapHint(msg) {
  tapHint.textContent = msg;
  tapHint.classList.add('show');
  clearTimeout(tapHintTimer);
  tapHintTimer = setTimeout(() => tapHint.classList.remove('show'), 1500);
}

// ── 파일 로드/저장 ───────────────────────────────────────────
btnLoad.onclick = () => fileInput.click();
btnSave.onclick = () => {
  const text = editor.value; if (!text) return;
  const now = new Date();
  const ts  = now.getFullYear().toString().slice(2)
    + String(now.getMonth()+1).padStart(2,'0') + String(now.getDate()).padStart(2,'0')
    + '_' + String(now.getHours()).padStart(2,'0') + String(now.getMinutes()).padStart(2,'0');
  const a = Object.assign(document.createElement('a'), {
    href: URL.createObjectURL(new Blob([text], {type:'text/plain'})),
    download: `${loadedFileName}_${ts}.txt`
  });
  a.click(); URL.revokeObjectURL(a.href);
};
fileInput.onchange = (e) => {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => { editor.value = ev.target.result; };
  reader.readAsText(file);
  loadedFileName = file.name.replace(/\.[^.]+$/, '');
  fileInput.value = '';
};

// ── 화면 전환 ────────────────────────────────────────────────
btnEdit.onclick = () => {
  prompterView.style.display = 'none';
  editorView.style.display   = 'flex';
  stopAll();
  btnStart.style.display = ''; btnStop.style.display = 'none';
};
btnStart.onclick = () => {
  const text = editor.value.trim(); if (!text) return;
  buildPrompter(text);
  editorView.style.display   = 'none';
  prompterView.style.display = 'block';
  btnStart.style.display = 'none'; btnStop.style.display = '';
  tapHint.style.display = mode === 'tap' ? 'block' : 'none';
  if (mode === 'voice')    startRecognition();
  else if (mode === 'tap') showTapHint('탭으로 시작/정지');
  else                     startScroll();
};
btnStop.onclick = () => {
  stopAll(); btnStop.style.display = 'none'; btnStart.style.display = '';
};

// ── 눈 고정 모드 ─────────────────────────────────────────────
btnEyeFix.onclick = () => {
  eyeFixMode = !eyeFixMode;
  btnEyeFix.classList.toggle('active', eyeFixMode);
  eyeFixCtrl.style.display = eyeFixMode ? 'block' : 'none';
  if (prompterView.style.display !== 'none') buildPrompter(editor.value.trim());
};
eyeWidthRange.oninput = () => {
  eyeWidthVal.textContent = eyeWidthRange.value + 'px';
  if (prompterView.style.display !== 'none' && eyeFixMode) buildPrompter(editor.value.trim());
};

// ── 텍스트 재편 ──────────────────────────────────────────────
function rewrapText(text, maxChars) {
  const PUNCT = new Set([...'.!?,。、…·~']);
  return text.split(/\n{2,}/).map(para => {
    const flat = para.replace(/\r?\n/g,' ').replace(/\s+/g,' ').trim();
    const chars = [...flat]; const lines = []; let pos = 0;
    while (pos < chars.length) {
      const rem = chars.length - pos;
      if (rem <= maxChars) { const t = chars.slice(pos).join('').trim(); if(t) lines.push(t); break; }
      const min = Math.floor(maxChars * 0.6); let at = -1;
      for (let i=maxChars-1;i>=min;i--) if(PUNCT.has(chars[pos+i])){ at=i+1; break; }
      if (at===-1) for(let i=maxChars-1;i>=min;i--) if(chars[pos+i]===' '){ at=i; break; }
      if (at===-1) at=maxChars;
      const line = chars.slice(pos,pos+at).join('').trim(); if(line) lines.push(line);
      pos+=at; while(pos<chars.length&&chars[pos]===' ') pos++;
    }
    return lines.join('\n');
  }).join('\n\n');
}

// ── 정렬/크기 ────────────────────────────────────────────────
btnAlignLeft.onclick   = () => { prompterText.style.textAlign='left';   btnAlignLeft.classList.add('active');   btnAlignCenter.classList.remove('active'); };
btnAlignCenter.onclick = () => { prompterText.style.textAlign='center'; btnAlignCenter.classList.add('active'); btnAlignLeft.classList.remove('active'); };
widthRange.oninput  = () => { if(!eyeFixMode) prompterText.style.maxWidth=widthRange.value+'em'; widthVal.textContent=widthRange.value+'자'; };
fontRange.oninput   = () => { prompterText.style.fontSize=fontRange.value+'px'; editor.style.fontSize=fontRange.value+'px'; fontVal.textContent=fontRange.value+'px'; };
speedRange.oninput  = () => { speedVal.textContent=speedRange.value; };

// ── 대본 렌더링 ──────────────────────────────────────────────
function buildPrompter(text) {
  if (eyeFixMode) {
    const fs = parseInt(prompterText.style.fontSize)||parseInt(fontRange.value)||36;
    const pw = parseInt(eyeWidthRange.value);
    prompterText.style.maxWidth = pw+'px';
    prompterText.textContent = rewrapText(text, Math.max(8, Math.floor(pw/fs)));
  } else {
    prompterText.style.maxWidth = parseInt(widthRange.value)+'em';
    prompterText.textContent = text;
  }
  prompterScroll.scrollTop = 0;
}

// ── 스크롤 ───────────────────────────────────────────────────
function startScroll() {
  if (scrollInterval) return;
  scrollInterval = setInterval(() => {
    prompterScroll.scrollTop += parseFloat(speedRange.value) * 0.5;
  }, 50);
  statusText.textContent = '스크롤 중 ▶'; indicator.classList.add('active');
}
function stopScroll() {
  clearInterval(scrollInterval); scrollInterval = null;
  statusText.textContent = '정지'; indicator.classList.remove('active');
}
function stopAll() {
  stopScroll(); stopRecognition(); statusText.textContent = '대기 중';
}

// ── 발화감지 ─────────────────────────────────────────────────
function startRecognition() {
  if (!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)) {
    statusText.textContent = '음성 미지원'; return;
  }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SR();
  recognition.lang = 'ko-KR'; recognition.continuous = true; recognition.interimResults = true;
  recognition.onstart = () => { isRecognizing=true; indicator.classList.add('active'); statusText.textContent='발화 감지 중...'; };
  recognition.onend   = () => { indicator.classList.remove('active'); if(isRecognizing) setTimeout(()=>{ try{recognition.start();}catch(e){} }, 300); };

  recognition.onspeechstart = () => {
    clearTimeout(speechTimeout);
    startScroll();
  };
  recognition.onresult = () => {
    clearTimeout(speechTimeout);
    if (!scrollInterval) startScroll();
    speechTimeout = setTimeout(() => stopScroll(), 2000);
  };
  recognition.onspeechend = () => {
    clearTimeout(speechTimeout);
    speechTimeout = setTimeout(() => stopScroll(), 2000);
  };
  try { recognition.start(); } catch(e) {}
}
function stopRecognition() {
  isRecognizing = false;
  if (recognition) { try { recognition.stop(); } catch(e){} recognition = null; }
  clearTimeout(speechTimeout);
  stopScroll();
}

// ── 키보드 단축키 ────────────────────────────────────────────
document.addEventListener('keydown', (e) => {
  if (e.target === editor || prompterView.style.display === 'none' || mode !== 'keyboard') return;
  switch(e.code) {
    case 'Space':      e.preventDefault(); scrollInterval ? stopScroll() : startScroll(); break;
    case 'ArrowUp':    e.preventDefault(); if(+speedRange.value<20){ speedRange.value=+speedRange.value+1; speedVal.textContent=speedRange.value; } break;
    case 'ArrowDown':  e.preventDefault(); if(+speedRange.value>1) { speedRange.value=+speedRange.value-1; speedVal.textContent=speedRange.value; } break;
    case 'ArrowLeft':  e.preventDefault(); prompterScroll.scrollTop -= 100; break;
    case 'ArrowRight': e.preventDefault(); prompterScroll.scrollTop += 100; break;
    case 'KeyR':       e.preventDefault(); prompterScroll.scrollTop = 0; break;
  }
});
</script>
</body>
</html>
